/* ---------- selection & input ---------- */

/* ---------- overlays ---------- */

  var starHtml = '';
  for (var i = 0; i < 3; i++) starHtml += '<span style="color:' + (i < stars ? '#d4af6a' : '#3a4659') + '">\u2605</span>';
  S.level++; S.found = []; S.revealed = []; S.bonusFound = []; S.order = null; S.hintsUsed = 0; S.hints++;
  save();
  var last = S.level >= LEVELS.length;
  openCard('<div class="stars">' + starHtml + '</div><h1>' + CHEERS[(n - 1) % CHEERS.length] + '</h1>' +
    '<p>Level ' + n + ' complete!' + (bonus ? '<br>' + bonus + ' bonus word' + (bonus > 1 ? 's' : '') + ' \u2605' : '') + '<br><b>+1 free hint</b></p>' +
    '<button class="big" id="nextBtn">' + (last ? 'Finish \u25B6' : 'Next Level \u25B6') + '</button>');
  $('nextBtn').addEventListener('click', function () { closeCard(); startLevel(); });
  confetti(); fanfare();
}
function showAllDone() {
  L = null; $('grid').innerHTML = ''; letterEls.forEach(function (e) { e.remove(); }); letterEls = []; cells = {};
  $('levelPill').textContent = 'All done!';
  openCard('<div class="stars" style="color:#d4af6a">\u2605\u2605\u2605</div><h1>Grandmaster</h1><p>You have completed all ' + LEVELS.length + ' levels of Letter Wheel Pro.</p>' +
    '<button class="big" id="againBtn">Play Again</button>');
  $('againBtn').addEventListener('click', function () { var h = S.hints, m = S.muted; S = defaults(); S.hints = Math.max(3, h); S.muted = m; save(); closeCard(); startLevel(); });
  confetti(); fanfare();
}
function showBonus() {
  if (overlayOpen || !L) return;
  var list = S.bonusFound.length ? S.bonusFound.slice().sort().map(esc).join(' ') : '<i>None yet. Any real English word of 3+ letters that is not in the grid counts.</i>';
  openCard('<h1>\u2605 Bonus Words</h1><div id="bonusList">' + list + '</div>' +
    '<p>Every ' + BONUS_PER_HINT + ' bonus words = 1 hint<br>Progress: <b>' + S.bonusMeter + ' / ' + BONUS_PER_HINT + '</b></p>' +
    '<button class="big" id="closeBtn">OK</button><button class="link" id="resetBtn">Start over from Level 1</button>');
  $('closeBtn').addEventListener('click', closeCard);
  $('resetBtn').addEventListener('click', function () {
    if (window.confirm('Start over from Level 1? Your progress will be reset.')) { var m = S.muted; S = defaults(); S.muted = m; save(); closeCard(); startLevel(); }
  });
}

/* ---------- sound (Web Audio, no files) ---------- */
var ac = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { var A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } catch (e) { ac = null; }
}
function tone(f, d, t, type, v) {
  if (!ac || S.muted) return;
  t = t || 0;
  try {
    var o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime + t;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.08, now); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g); g.connect(ac.destination); o.start(now); o.stop(now + d + 0.03);
  } catch (e) {}
}
function blip(n) { tone(440 * Math.pow(2, (n - 1) * 2 / 12), 0.12, 0, 'triangle'); }
function chime() { tone(523, 0.15); tone(659, 0.15, 0.09); tone(784, 0.25, 0.18); }
function buzz() { tone(160, 0.2, 0, 'square', 0.04); }
function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.3, i * 0.12, 'triangle', 0.09); }); }

/* ---------- confetti ---------- */
function confetti() {
  var cv = $('confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var cols = ['#d4af6a', '#f3ead8', '#b8914b', '#7fb3a3', '#e6c784', '#8d97a8'], P = [];
  for (var i = 0; i < 160; i++) P.push({ x: W / 2 + (Math.random() - 0.5) * 60, y: H * 0.35, vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 15 - 4, s: 7 + Math.random() * 7, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35 });
  var t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(function (p) { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- home-screen icon (generated, no external files) ---------- */
function makeIcon() {
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180; var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#22324a'); g.addColorStop(1, '#0b111c');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#d4af6a'; x.lineWidth = 5; x.beginPath(); x.arc(90, 90, 70, 0, Math.PI * 2); x.stroke();
    var letters = 'PROWD';
    for (var i = 0; i < 5; i++) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / 5, px = 90 + 45 * Math.cos(a), py = 90 + 45 * Math.sin(a);
      x.fillStyle = '#d4af6a'; x.beginPath(); x.arc(px, py, 21, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#0f1724'; x.font = 'bold 26px Georgia'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(letters[i], px, py + 1);
    }
    var link = document.createElement('link'); link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png'); document.head.appendChild(link);
  } catch (e) {}
}

/* ---------- events ---------- */
var box = $('wheelBox'), activeTouch = null;
box.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (activeTouch !== null) return;
  var t = e.changedTouches[0]; activeTouch = t.identifier; onStart(t.clientX, t.clientY);
}, { passive: false });
box.addEventListener('touchmove', function (e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; if (t.identifier === activeTouch) onMove(t.clientX, t.clientY); }
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches[i].identifier === activeTouch) { activeTouch = null; onEnd(); } }
}
box.addEventListener('touchend', touchEnd, { passive: false });
box.addEventListener('touchcancel', touchEnd, { passive: false });
box.addEventListener('mousedown', function (e) { if (e.button === 0) { e.preventDefault(); onStart(e.clientX, e.clientY); } });
window.addEventListener('mousemove', function (e) { if (dragging) onMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', function () { onEnd(); });
// Block page scroll / pull-to-refresh / pinch zoom everywhere except the bonus list.
document.addEventListener('touchmove', function (e) { if (!(e.target.closest && e.target.closest('#bonusList'))) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });

$('shuffleBtn').addEventListener('click', shuffle);
$('hintBtn').addEventListener('click', function () { audioInit(); useHint(); });
$('goBtn').addEventListener('click', function () { if (sel.length >= 2) submit(); else { flash(currentWord(), 'bad'); clearSel(); } });
$('clearBtn').addEventListener('click', clearSel);
$('bonusPill').addEventListener('click', showBonus);
$('soundBtn').addEventListener('click', function () { S.muted = !S.muted; save(); updateHud(); audioInit(); tone(660, 0.1); });
var rT = 0;
window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { layoutGrid(); layoutWheel(); }, 60); });

// Small hook for automated tests (read-only state + letter positions).
window.__letterWheelPro = {
  state: function () { return JSON.parse(JSON.stringify(S)); },
  level: function () { return L; },
  letterCenter: function (i) { var r = letterEls[i].getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
};

makeIcon();
startLevel();
})();
</script>
